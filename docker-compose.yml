version: "3.8"

services:
  # ─── Qdrant Vector Database ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
      # Curated ayurveda data lives outside the app tree so bind-mounting the
      # source over /app never hides it (fail-fast loader needs it present).
      - ./backend/data/ayurveda:/app/data/ayurveda:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # The Next.js frontend is intentionally not a compose service: there is no
  # frontend/Dockerfile in this repo (Render deploys it via its node buildpack,
  # see render.yaml). Run it on the host with `npm install && npm run dev` —
  # see README "Quick Start Option A". It defaults to http://localhost:8000
  # for the API, which is exactly where the backend service above publishes.

volumes:
  qdrant_storage:
