services:
  - type: web
    name: ipsakti-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ipsakti-frontend.onrender.com

  - type: web
    name: ipsakti-qdrant
    runtime: docker
    dockerfilePath: ./Dockerfile.qdrant
    # Free tier: no disk → ephemeral storage. Corpus is (re)seeded
    # externally: QDRANT_URL=<service-url> python -m scripts.ingest_documents

  - type: web
    name: ipsakti-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
