services:
  # ── Backend: FastAPI ─────────────────────────────────────────────────────────
  - type: web
    name: ipsakti-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12

      # NVIDIA NIM
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_LLM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_EMBED_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: NVIDIA_EMBED_DIMENSIONS
        value: 2048

      # Sarvam
      - key: SARVAM_API_KEY
        sync: false

      # Qdrant Cloud (persistent external cluster)
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # Supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

      # CORS
      - key: CORS_ORIGINS
        value: https://ipsakti-frontend.onrender.com,http://localhost:3000

  # ── Frontend: Next.js ────────────────────────────────────────────────────────
  - type: web
    name: ipsakti-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build -- --webpack && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: cd frontend && HOSTNAME=0.0.0.0 PORT=$PORT node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ipsakti-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
